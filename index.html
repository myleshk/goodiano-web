<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goodiano">
  <meta name="description" content="Virtual piano keyboard with realistic Yamaha U1 sound">

  <title>Goodiano</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">

  <!-- Keep a versioned URL so an older service worker cannot serve stale CSS. -->
  <link rel="stylesheet" href="css/main.css?v=0-1-0">
</head>
<body>
  <div class="app">
    <!-- Status bar spacer for notched iPhones -->
    <div class="status-bar-spacer"></div>

    <!-- Loading overlay -->
    <div class="loading-overlay">
      <div class="loading-progress" role="progressbar" aria-label="Loading audio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="loading-progress-label">0%</span>
      </div>
      <div class="loading-text">Loading Yamaha U1&hellip;</div>
      <button class="loading-retry" type="button">Retry</button>
    </div>

    <!-- Mini-map navigator -->
    <div class="minimap-container"></div>

    <!-- Piano keyboard -->
    <div class="keyboard-area">
      <div class="keyboard-scroll">
        <div class="keyboard-content"></div>
      </div>
    </div>

    <!-- Subtle brand -->
    <div class="app-brand">
      <span class="app-brand-text">Goodiano</span>
    </div>
  </div>

  <button class="settings-toggle" type="button" aria-label="Open settings">⚙</button>

  <section class="settings-panel" hidden aria-label="Settings">
    <div class="sensitivity-control">
      <label id="velocity-sensitivity-label" for="velocity-sensitivity">Motion Sensitivity</label>
      <div class="sensitivity-input-row">
        <input id="velocity-sensitivity" class="velocity-sensitivity" type="range" min="1" max="100" value="50"
          aria-describedby="velocity-sensitivity-description motion-permission-feedback">
        <output class="velocity-sensitivity-output" for="velocity-sensitivity">50</output>
      </div>
      <p id="velocity-sensitivity-description" class="sensitivity-description">Adjusts motion-based touch velocity.</p>
    </div>
    <p class="settings-help motion-permission-guidance">Motion permission is needed for touch velocity.</p>
    <p id="motion-permission-feedback" class="motion-permission-feedback" role="status" hidden></p>
    <div class="motion-permission-status" hidden>motion permission: unknown</div>
    <button class="settings-action velocity-debug-toggle" type="button">Show Debug</button>
    <button class="settings-action app-reload-button" type="button">Reload App</button>
    <div class="settings-version">Goodiano · v0.2.0</div>
  </section>

  <aside class="velocity-debug" hidden aria-live="polite">
    <div class="velocity-debug-title">Input Debug</div>
    <div class="velocity-debug-value">Velocity: --</div>
    <div class="velocity-debug-track"><div class="velocity-debug-fill"></div></div>
    <div class="velocity-debug-source">source: --</div>
    <div class="velocity-debug-raw">pressure -- &nbsp;·&nbsp; motion Δ --</div>
  </aside>

  <script type="module" src="./js/app/app.ts?v=0-1-0"></script>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=0-1-0')
        .then(registration => registration.update())
        .catch(() => {});
    }
  </script>
</body>
</html>
