<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goodiano">
  <meta name="description" content="Virtual piano keyboard with realistic Yamaha U1 sound">

  <title>Goodiano</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app">
    <!-- Status bar spacer for notched iPhones -->
    <div class="status-bar-spacer"></div>

    <!-- Loading overlay -->
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Yamaha U1&hellip;</div>
    </div>

    <!-- Mini-map navigator -->
    <div class="minimap-container"></div>

    <!-- Piano keyboard -->
    <div class="keyboard-area">
      <div class="keyboard-scroll">
        <div class="keyboard-content"></div>
      </div>
    </div>

    <!-- Subtle brand -->
    <div class="app-brand">
      <span class="app-brand-text">Goodiano</span>
    </div>
  </div>

  <script type="module" src="js/app/app.js"></script>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
