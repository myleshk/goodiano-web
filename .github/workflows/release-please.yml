name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy workflow only reads the repository. This one writes: it grooms a
# release pull request that bumps the version and the changelog, and on merge
# it tags the commit and publishes the GitHub release.
permissions:
  contents: write
  pull-requests: write

concurrency:
  # Never groom the release branch from two runs at once — they would fight
  # over the same pull request. Queue instead of cancelling, so the run that
  # tags a merged release is never dropped part way through.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # On a normal push this opens or updates the pending release pull
      # request, with the next version derived from the conventional-commit
      # types since the last release. On the push that merges that pull
      # request, it instead tags the release and cuts the GitHub release.
      - name: Prepare a release pull request, or release a merged one
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
